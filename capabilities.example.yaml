# What THIS deployment lets the agent reach. Copy to capabilities.yaml and edit.
#
# Separate from agent.yaml on purpose. agent.yaml describes the agent and is the
# same for everyone running this relay; this file is one deployment's reach, and
# it names the specific systems your workflows happen to use. Keeping them apart
# is what lets agent.yaml stay generic, which the repo depends on.
#
# Provider-agnostic, all of it. How each of these becomes a vault credential, an
# environment network policy or an inline session field is in api/providers/ and
# in the reconcile scripts, because the two providers express every one of them
# differently. Nothing here should read like either API.
#
# Absent entirely is a valid and safe configuration: the agent reaches the MCP
# servers in agent.yaml, has no shell, and can reach nothing else.

# NOTE: `sandbox` is NOT in this file. It is the AGENT_SANDBOX environment
# variable, set to `none` or `hosted`, because the relay needs it on every
# session create and this file is gitignored and therefore not deployed. A
# `sandbox:` key here is refused rather than ignored.
#
#   none    MCP only. The agent cannot run commands, so it cannot reach a host
#           that is not an MCP server however the egress list below is set.
#   hosted  The provider runs a container. The agent gets a shell, so every
#           host in `egress` becomes reachable with curl, not only through MCP.

# Secrets the agent authenticates with, by NAME and by the hosts each one is
# for. Never values: this file is committed, and a value here would be a
# credential in a git history.
#
# `hosts` is where the secret is substituted, not what it may do there. ONCE
# THE AGENT CAN REACH A HOST WITH A SECRET, EVERY OPERATION THAT SECRET
# PERMITS IS AVAILABLE TO IT. A token that can delete lets the agent delete,
# and nothing in this file or in either provider can narrow that to reads:
# scoping here is per host, never per verb. So pick a token whose own grant is
# already as small as the work needs, and where a provider offers no read-only
# token, know that your step instructions are the only thing standing between
# the agent and the rest of that API.
#
# The agent never sees the value. It holds a placeholder and the real secret is
# substituted into the request at egress, which is the property worth having if
# your agent writes prose anywhere a value could be echoed into.
#
# Name it for the scope it actually has. The agent cannot read the value but it
# can read the name and will reason from it: one of ours reported its
# credential as read-only on the strength of a name ending _READ_TOKEN, which
# stopped being true the moment the grant widened. Rename when you re-scope.
secrets: []
# secrets:
#   - name: EXAMPLE_API_WRITE_TOKEN
#     hosts: [api.example.com]

# Hosts the agent is expected to reach that need no secret of ours.
#
# READ THIS AS INTENT, NOT AS A BOUNDARY, BECAUSE WHAT ENFORCES IT DIFFERS BY
# PROVIDER AND ONE OF THEM DOES NOT.
#
# On Anthropic the environment carries a network policy, and bin/capabilities-apply
# writes this list into it. Egress to anything else is refused at the proxy with
# a 403, so here the list is a real boundary.
#
# On OpenAI there is no environment object to write a policy to. The sandbox's
# outbound access is not constrained by this file, and a credential's `hosts`
# scope only where that secret is substituted. We watched an agent on a hosted
# OpenAI sandbox reach two hosts that no credential scoped it to. So on that
# provider this list documents what the agent is meant to need, and does not
# stop it reaching more.
#
# Declare it either way: the reconcile script needs it, it is how a reader
# learns what the deployment depends on, and it becomes a boundary the moment a
# provider gives us one to write. Just do not treat it as containment where it
# is not.
#
# A host carrying a secret above does not need repeating here; the reconcile
# scripts work out what each provider needs told, which differs between them.
egress: []
# egress:
#   - api.example.com
