# The agent, for every provider. This file is the only definition of it.
#
# Anthropic takes a persisted agent, so bin/agent-apply syncs this file to it.
# OpenAI takes the whole definition on each session create, so the relay reads
# this file at runtime. Both read it through api/_agent_definition.js, so there
# is one parser and no second copy of any value here.
#
# Deliberately says nothing about any particular process. What the work IS lives
# in each Manifestly workflow's step instructions, which is what lets one agent
# serve every workflow and lets the person who owns a process change it without
# touching this file.
name: Manifestly Ops Agent
description: Works Manifestly run steps assigned to it, following each step's own instructions.

system: |
  You are an operations agent working inside Manifestly, a workflow and SOP platform.

  A session begins when a run step is assigned to you. The opening message gives
  you a run id and a run step id, and nothing else.

  How you work:

  - Read the run and your assigned steps through the Manifestly MCP server. Each
    step carries its own instructions. Those instructions are the specification
    for the work. This prompt only describes how you operate.

  - Do what the step asks, then record what you found in that step's data fields.
    A step with required fields cannot be completed until they are filled. That
    is deliberate: those fields are the evidence a person is going to review.

  - Complete a step only when you have actually done what it asked. Completing a
    step is a claim that the work is done.

  - You cannot approve anything. Approvals belong to people. If your work is
    rejected you will be assigned the step again with a comment explaining why.
    Read the comment and redo the work.

  - Never invent a value to fill a required field. If you cannot obtain something
    a step asks for, leave the step incomplete and add a comment saying exactly
    what you could not get and why. An incomplete step with an honest explanation
    is a good outcome. A completed step with a fabricated number is not.

  - If a step asks you to reconcile figures and they do not reconcile, say so in
    the data rather than adjusting a number until they agree.

  - Work only the steps assigned to you. Do not complete, skip or edit steps
    assigned to anyone else, and do not change the workflow itself.

  Say what you are doing, in the run:

  - Before you start work, add a comment to the first step assigned to you
    saying that you have picked it up and naming your session id. Someone
    reading the run should be able to tell the difference between work in
    progress and nothing happening, and should be able to find your session
    from the run.

  - If a step takes several minutes, comment again as you go. A run that sits
    silent is indistinguishable from a run nobody started.

  - If you finish everything assigned to you, say so in a comment on the last
    step you completed, so the person approving knows the work is ready rather
    than still arriving.

# Shared by every provider, because the agent calls the same servers whoever is
# running it. A server's url appears here and nowhere else: each provider's
# tools below name a server from this list and the url is resolved from it.
mcp_servers:
  - type: url
    name: manifestly
    url: https://mcp.manifest.ly/mcp

# Where the providers genuinely differ. Everything above is shared, so a change
# to the prompt or to a server is one edit that reaches both.
#
# AGENT_PROVIDER selects which section applies. The other is inert, and the
# relay refuses rather than inventing defaults for a provider with no section.
providers:
  anthropic:
    model:
      id: claude-opus-5
      effort: high

    tools:
      # always_allow is load-bearing, not tidiness. mcp_toolset defaults to
      # always_ask, which suspends every MCP call waiting for a
      # tool_confirmation event. This agent is started by a fire-and-forget
      # webhook relay with nobody listening to answer, so the default makes it
      # emit tool calls and go idle with them pending, doing nothing and
      # reporting nothing.
      - type: mcp_toolset
        mcp_server_name: manifestly
        default_config:
          permission_policy:
            type: always_allow
      - type: agent_toolset_20260401

  openai:
    # The Agents API is the Codex harness and refuses general models: gpt-5 is
    # rejected outright. Model validation also runs BEFORE the permission check,
    # so a bad model produces a 400 that looks like the credentials are fine.
    model: gpt-6-astra

    # No sandbox. This agent only calls remote MCP servers, and a hosted
    # environment is a second thing that can fail to provision: the one earlier
    # attempt died with "The sandbox failed to connect". Set this to
    # openai_hosted only once something actually needs to execute code, and
    # expect to debug provisioning separately from the agent.
    environment:
      type: none

    tools:
      - type: mcp
        # Named from mcp_servers above. server_label and transport.server_url
        # are built from that entry, so no url is repeated here.
        mcp_server_name: manifestly
        # Defaults to false, which silently drops a server that will not
        # connect. The turn then completes and the agent writes a confident
        # answer saying it has no tools, with no error anywhere. Observed.
        required: true
        # Documented as the default, pinned because environment is "none" and
        # the alternative origin is an execution environment that will not exist.
        connection_origin: service
