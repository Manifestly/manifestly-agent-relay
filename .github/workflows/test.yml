name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The suite has no test dependencies, but the signature and claim code
      # both run against installed packages, so install what package.json pins
      # rather than testing a tree that does not resemble the deployed one.
      - run: npm ci
      - run: npm test
