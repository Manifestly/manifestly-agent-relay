name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The suite has no test dependencies, but the signature and claim code
      # run against installed packages, so the tree under test should resemble
      # the deployed one.
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # The one context the ruleset requires. Adding a job later means adding it to
  # `needs` here, not editing the ruleset — and a ruleset that names a context
  # nothing produces blocks every PR while looking like a slow queue, which is
  # how PR #3 sat unmergeable.
  check:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: |
          [[ "${{ needs.test.result }}" == "success" ]]
